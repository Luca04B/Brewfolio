name: brewfolio

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/backend/Brewfolio.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Brewfolio: Server=sqlserver,1433;Database=Brewfolio;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Frontend__Origin: http://localhost:4200
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"

  frontend:
    build:
      context: src/frontend
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  sqlserver-data:

