name: brewfolio

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/backend/Brewfolio.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Brewfolio: Server=sqlserver,1433;Database=Brewfolio;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Frontend__Origin: http://localhost:4200
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-brewfolio}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-ChangeMe_OnlyForLocalMinio123!}
      ObjectStorage__BucketName: brewfolio-images
      ObjectStorage__Initialize: "true"
    depends_on:
      - sqlserver
      - minio
    ports:
      - "8080:8080"

  frontend:
    build:
      context: src/frontend
    depends_on:
      - api
    ports:
      - "4200:80"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-brewfolio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe_OnlyForLocalMinio123!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  sqlserver-data:
  minio-data:
